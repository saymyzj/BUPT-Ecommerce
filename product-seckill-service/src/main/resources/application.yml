server:
  port: 8082

spring:
  application:
    name: product-seckill-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bupt_ecommerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

app:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:bupt-ecommerce-internal-dev-token}
  order-service:
    base-url: http://localhost:8083
  local-demo:
    enable-default-user: false
    default-user-id: 10001
    default-admin-id: 1
  seckill:
    user-flag-ttl-seconds: 14400
    result-ttl-seconds: 86400
  seckill-publisher:
    fixed-delay-ms: 5000
    max-attempts: 12
  seckill-waitlist:
    enabled: ${SECKILL_WAITLIST_ENABLED:false}
    max-size-per-activity: ${SECKILL_WAITLIST_MAX_SIZE:200}
    promotion-delay-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info
