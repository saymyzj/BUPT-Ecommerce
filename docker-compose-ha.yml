services:
  redis-primary:
    image: redis:7.4
    container_name: bupt-ecommerce-redis-primary
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/primary.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-primary-data:/data
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis-replica-1:
    image: redis:7.4
    container_name: bupt-ecommerce-redis-replica-1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/replica.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-replica-1-data:/data
    ports:
      - "6384:6379"
    depends_on:
      redis-primary:
        condition: service_healthy

  redis-replica-2:
    image: redis:7.4
    container_name: bupt-ecommerce-redis-replica-2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/replica.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-replica-2-data:/data
    ports:
      - "6385:6379"
    depends_on:
      redis-primary:
        condition: service_healthy

  redis-sentinel-1:
    image: redis:7.4
    container_name: bupt-ecommerce-redis-sentinel-1
    command: ["sh", "-c", "cp /sentinel-template/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/sentinel-template/sentinel.conf:ro
    ports:
      - "26379:26379"
    depends_on:
      redis-primary:
        condition: service_healthy

  redis-sentinel-2:
    image: redis:7.4
    container_name: bupt-ecommerce-redis-sentinel-2
    command: ["sh", "-c", "cp /sentinel-template/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/sentinel-template/sentinel.conf:ro
    ports:
      - "26380:26379"
    depends_on:
      redis-primary:
        condition: service_healthy

  redis-sentinel-3:
    image: redis:7.4
    container_name: bupt-ecommerce-redis-sentinel-3
    command: ["sh", "-c", "cp /sentinel-template/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/sentinel-template/sentinel.conf:ro
    ports:
      - "26381:26379"
    depends_on:
      redis-primary:
        condition: service_healthy

  redis-proxy:
    image: haproxy:3.0-alpine
    container_name: bupt-ecommerce-redis-proxy
    volumes:
      - ./infra/redis/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "6380:6379"
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica-1:
        condition: service_started
      redis-replica-2:
        condition: service_started

volumes:
  redis-primary-data:
  redis-replica-1-data:
  redis-replica-2-data:
