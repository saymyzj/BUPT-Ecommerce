server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: product-seckill-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**,/api/seckill/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
        - id: ai-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/ai/**
        - id: push-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/push/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
