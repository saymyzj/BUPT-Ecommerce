server:
  port: 8084

spring:
  application:
    name: ai-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  product-service:
    base-url: http://localhost:8082
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-v4-flash}
    timeout-ms: 8000
  ai:
    cache:
      ttl-seconds: 3600
