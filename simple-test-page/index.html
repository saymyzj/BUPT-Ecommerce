<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUPT Ecommerce 联调测试页</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d8dee9;
      --text: #1f2937;
      --muted: #5b6678;
      --primary: #1f7a8c;
      --primary-dark: #145866;
      --danger: #b42318;
      --ok: #137333;
      --warn: #a15c00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 440px) 1fr;
      gap: 16px;
      padding: 16px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }

    .stack {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    button {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--primary-dark); }
    button.secondary { background: #44546a; }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .actions button {
      flex: 1 1 150px;
    }

    .state-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .state-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fafbfc;
      min-height: 58px;
    }

    .state-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .state-item strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: 13px;
      margin-top: 2px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 3px 10px;
      border: 1px solid var(--line);
      font-size: 13px;
      background: #fff;
      color: var(--muted);
    }

    .status.ok { color: var(--ok); border-color: #b7dfc2; background: #f0fff4; }
    .status.warn { color: var(--warn); border-color: #f4d19a; background: #fff8ec; }
    .status.err { color: var(--danger); border-color: #f2b8b5; background: #fff1f0; }

    pre {
      margin: 0;
      padding: 12px;
      background: #111827;
      color: #d1d5db;
      border-radius: 8px;
      min-height: 180px;
      max-height: 520px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }

    .hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .state-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>BUPT Ecommerce 联调测试页</h1>
    <div class="status warn" id="pushState">推送未连接</div>
    <p class="hint">所有请求默认走 Gateway：<code>http://localhost:8080</code>。秒杀接口只展示排队结果，订单成功必须来自 SSE 推送或订单查询。</p>
  </header>

  <main>
    <div class="stack">
      <section>
        <h2>环境与登录</h2>
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" value="http://localhost:8080">
        <div class="grid">
          <div>
            <label for="username">普通用户</label>
            <input id="username" value="alice">
          </div>
          <div>
            <label for="password">普通用户密码</label>
            <input id="password" value="123456" type="password">
          </div>
          <div>
            <label for="phone">手机号</label>
            <input id="phone" value="13800000000">
          </div>
          <div>
            <label for="adminUsername">管理员</label>
            <input id="adminUsername" value="admin">
          </div>
          <div>
            <label for="adminPassword">管理员密码</label>
            <input id="adminPassword" value="admin123456" type="password">
          </div>
        </div>
        <div class="actions">
          <button id="registerBtn">注册普通用户</button>
          <button id="loginBtn">普通用户登录</button>
          <button id="adminLoginBtn">管理员登录</button>
          <button id="meBtn" class="secondary">当前用户</button>
        </div>
      </section>

      <section>
        <h2>管理员准备</h2>
        <div class="grid">
          <div>
            <label for="productName">商品名称</label>
            <input id="productName" value="秒杀耳机">
          </div>
          <div>
            <label for="price">原价</label>
            <input id="price" value="699" type="number">
          </div>
          <div>
            <label for="stock">库存</label>
            <input id="stock" value="20" type="number">
          </div>
          <div>
            <label for="seckillStock">秒杀库存</label>
            <input id="seckillStock" value="5" type="number">
          </div>
          <div>
            <label for="seckillPrice">秒杀价</label>
            <input id="seckillPrice" value="99.9" type="number" step="0.01">
          </div>
          <div>
            <label for="quantity">购买数量</label>
            <input id="quantity" value="1" type="number">
          </div>
        </div>
        <label for="description">商品描述</label>
        <textarea id="description">低延迟蓝牙耳机，适合学生通勤和在线学习。</textarea>
        <div class="actions">
          <button id="createProductBtn">创建商品</button>
          <button id="setStockBtn">设置库存</button>
          <button id="createActivityBtn">创建秒杀活动</button>
        </div>
      </section>

      <section>
        <h2>用户秒杀与查询</h2>
        <div class="grid">
          <div>
            <label for="productId">productId</label>
            <input id="productId" placeholder="创建商品后自动填充">
          </div>
          <div>
            <label for="activityId">activityId</label>
            <input id="activityId" placeholder="创建活动后自动填充">
          </div>
          <div>
            <label for="orderId">orderId</label>
            <input id="orderId" placeholder="推送或订单列表后自动填充">
          </div>
          <div>
            <label for="keyword">商品关键词</label>
            <input id="keyword" value="">
          </div>
        </div>
        <div class="actions">
          <button id="connectPushBtn">连接推送</button>
          <button id="disconnectPushBtn" class="danger">断开推送</button>
          <button id="listProductsBtn" class="secondary">商品列表</button>
          <button id="productDetailBtn" class="secondary">商品详情</button>
          <button id="activityDetailBtn" class="secondary">活动详情</button>
          <button id="seckillBtn">发起秒杀</button>
          <button id="seckillResultBtn" class="secondary">秒杀结果</button>
          <button id="ordersBtn" class="secondary">订单列表</button>
          <button id="orderDetailBtn" class="secondary">订单详情</button>
          <button id="adminOrdersBtn" class="secondary">管理员订单</button>
        </div>
      </section>

      <section>
        <h2>AI 商品咨询</h2>
        <label for="question">问题</label>
        <textarea id="question">这款商品适合学生党购买吗？</textarea>
        <div class="actions">
          <button id="aiBtn">咨询 AI</button>
        </div>
      </section>
    </div>

    <div class="stack">
      <section>
        <h2>当前状态</h2>
        <div class="state-row">
          <div class="state-item"><span>userId</span><strong id="stateUserId">-</strong></div>
          <div class="state-item"><span>role</span><strong id="stateRole">-</strong></div>
          <div class="state-item"><span>productId</span><strong id="stateProductId">-</strong></div>
          <div class="state-item"><span>activityId</span><strong id="stateActivityId">-</strong></div>
          <div class="state-item"><span>seckillStatus</span><strong id="stateSeckill">-</strong></div>
          <div class="state-item"><span>orderId</span><strong id="stateOrderId">-</strong></div>
          <div class="state-item"><span>orderStatus</span><strong id="stateOrder">-</strong></div>
          <div class="state-item"><span>AI status</span><strong id="stateAi">-</strong></div>
        </div>
      </section>

      <section>
        <h2>响应与事件日志</h2>
        <pre id="log"></pre>
        <div class="actions">
          <button id="clearLogBtn" class="secondary">清空日志</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function readStoredJson(key, fallback) {
      const raw = localStorage.getItem(key);
      if (!raw || raw === "undefined") {
        localStorage.removeItem(key);
        return fallback;
      }
      try {
        return JSON.parse(raw);
      } catch (_) {
        localStorage.removeItem(key);
        return fallback;
      }
    }

    const state = {
      token: localStorage.getItem("token") || "",
      adminToken: localStorage.getItem("adminToken") || "",
      user: readStoredJson("user", null),
      pushAbort: null
    };

    function baseUrl() {
      return $("baseUrl").value.replace(/\/+$/, "");
    }

    function nowLocal(offsetMinutes = 0) {
      const date = new Date(Date.now() + offsetMinutes * 60000);
      const pad = (value) => String(value).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function log(title, value) {
      const text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      $("log").textContent = `[${new Date().toLocaleTimeString()}] ${title}\n${text}\n\n` + $("log").textContent;
    }

    function setStatus(element, text, kind = "") {
      element.textContent = text;
      element.className = `status ${kind}`.trim();
    }

    function updateState() {
      $("stateUserId").textContent = state.user?.userId ?? "-";
      $("stateRole").textContent = state.user?.role ?? "-";
      $("stateProductId").textContent = $("productId").value || "-";
      $("stateActivityId").textContent = $("activityId").value || "-";
      $("stateOrderId").textContent = $("orderId").value || "-";
    }

    async function request(method, path, body, tokenType = "user") {
      const headers = { "Content-Type": "application/json" };
      const token = tokenType === "admin" ? state.adminToken : (tokenType === "user" ? state.token : "");
      if (token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(baseUrl() + path, {
        method,
        headers,
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      const contentType = response.headers.get("content-type") || "";
      const payload = contentType.includes("application/json") ? await response.json() : await response.text();
      log(`${method} ${path}`, payload);
      return payload;
    }

    function pickId(payload, key, inputId) {
      const value = payload?.data?.[key];
      if (value !== undefined && value !== null) {
        $(inputId).value = value;
        updateState();
      }
    }

    function requireInput(inputId, label) {
      const value = $(inputId).value.trim();
      if (!value) {
        log("缺少必要参数", `请先填写或生成 ${label}。`);
        return null;
      }
      return value;
    }

    async function register() {
      await request("POST", "/api/auth/register", {
        username: $("username").value,
        password: $("password").value,
        phone: $("phone").value
      }, "none");
    }

    async function login() {
      const payload = await request("POST", "/api/auth/login", {
        username: $("username").value,
        password: $("password").value
      }, "none");
      if (payload.code === 0) {
        state.token = payload.data.token;
        state.user = payload.data.user;
        localStorage.setItem("token", state.token);
        localStorage.setItem("user", JSON.stringify(state.user));
        updateState();
      }
    }

    async function adminLogin() {
      const payload = await request("POST", "/api/auth/admin/login", {
        username: $("adminUsername").value,
        password: $("adminPassword").value
      }, "none");
      if (payload.code === 0) {
        state.adminToken = payload.data.token;
        localStorage.setItem("adminToken", state.adminToken);
      }
    }

    async function createProduct() {
      const payload = await request("POST", "/api/products", {
        name: $("productName").value,
        price: Number($("price").value),
        description: $("description").value
      }, "admin");
      pickId(payload, "productId", "productId");
    }

    async function setStock() {
      const productId = requireInput("productId", "productId");
      if (!productId) return;
      await request("PUT", `/api/products/${productId}/stock`, {
        stock: Number($("stock").value)
      }, "admin");
    }

    async function createActivity() {
      const productId = requireInput("productId", "productId");
      if (!productId) return;
      const payload = await request("POST", "/api/seckill/activities", {
        productId: Number(productId),
        startTime: nowLocal(-1),
        endTime: nowLocal(60),
        seckillPrice: Number($("seckillPrice").value),
        seckillStock: Number($("seckillStock").value)
      }, "admin");
      pickId(payload, "activityId", "activityId");
    }

    async function seckill() {
      const activityId = requireInput("activityId", "activityId");
      if (!activityId) return;
      const payload = await request("POST", `/api/seckill/activities/${activityId}/orders`, {
        quantity: Number($("quantity").value)
      });
      $("stateSeckill").textContent = payload?.data?.status || payload?.message || "-";
      if (payload?.data?.status === "QUEUEING") {
        setStatus($("pushState"), "等待订单推送", "warn");
      }
    }

    async function consultAi() {
      const productId = requireInput("productId", "productId");
      if (!productId) return;
      const payload = await request("POST", `/api/ai/products/${productId}/consult`, {
        question: $("question").value
      });
      $("stateAi").textContent = payload?.data?.status || payload?.message || "-";
    }

    async function connectPush() {
      if (!state.token) {
        log("推送连接失败", "请先普通用户登录，获取 CUSTOMER token。");
        return;
      }
      disconnectPush(false);
      state.pushAbort = new AbortController();
      setStatus($("pushState"), "推送连接中", "warn");
      try {
        const response = await fetch(baseUrl() + "/api/push/orders/subscribe", {
          headers: { Authorization: `Bearer ${state.token}` },
          signal: state.pushAbort.signal
        });
        if (!response.ok || !response.body) {
          throw new Error(`SSE HTTP ${response.status}`);
        }
        setStatus($("pushState"), "推送已连接", "ok");
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split(/\n\n|\r\n\r\n/);
          buffer = chunks.pop();
          chunks.forEach(handleSseChunk);
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          setStatus($("pushState"), "推送连接错误", "err");
          log("SSE ERROR", error.message);
        }
      }
    }

    function handleSseChunk(chunk) {
      const event = { name: "message", data: "" };
      chunk.split(/\r?\n/).forEach((line) => {
        if (line.startsWith("event:")) event.name = line.slice(6).trim();
        if (line.startsWith("data:")) event.data += line.slice(5).trim();
      });
      if (!event.data) return;
      let payload = event.data;
      try { payload = JSON.parse(event.data); } catch (_) {}
      log(`SSE ${event.name}`, payload);
      const data = payload?.data;
      if (event.name === "order-result" && data) {
        $("orderId").value = data.orderId || "";
        $("stateOrder").textContent = data.status || "-";
        $("stateSeckill").textContent = data.status || "-";
        setStatus($("pushState"), `收到订单事件：${data.status}`, data.status === "CREATED" ? "ok" : "warn");
        updateState();
      }
    }

    function disconnectPush(showLog = true) {
      if (state.pushAbort) {
        state.pushAbort.abort();
        state.pushAbort = null;
      }
      setStatus($("pushState"), "推送未连接", "warn");
      if (showLog) log("SSE", "已断开推送连接");
    }

    $("registerBtn").onclick = register;
    $("loginBtn").onclick = login;
    $("adminLoginBtn").onclick = adminLogin;
    $("meBtn").onclick = () => request("GET", "/api/users/me");
    $("createProductBtn").onclick = createProduct;
    $("setStockBtn").onclick = setStock;
    $("createActivityBtn").onclick = createActivity;
    $("connectPushBtn").onclick = connectPush;
    $("disconnectPushBtn").onclick = () => disconnectPush();
    $("listProductsBtn").onclick = () => request("GET", `/api/products?page=1&pageSize=10&keyword=${encodeURIComponent($("keyword").value)}`, undefined, "none");
    $("productDetailBtn").onclick = () => {
      const productId = requireInput("productId", "productId");
      if (!productId) return;
      request("GET", `/api/products/${productId}`, undefined, "none");
    };
    $("activityDetailBtn").onclick = () => {
      const activityId = requireInput("activityId", "activityId");
      if (!activityId) return;
      request("GET", `/api/seckill/activities/${activityId}`, undefined, "none");
    };
    $("seckillBtn").onclick = seckill;
    $("seckillResultBtn").onclick = () => {
      const activityId = requireInput("activityId", "activityId");
      if (!activityId) return;
      request("GET", `/api/seckill/activities/${activityId}/result`);
    };
    $("ordersBtn").onclick = async () => {
      const payload = await request("GET", "/api/orders?page=1&pageSize=10");
      const first = payload?.data?.records?.[0];
      if (first?.orderId) $("orderId").value = first.orderId;
      updateState();
    };
    $("orderDetailBtn").onclick = async () => {
      const orderId = requireInput("orderId", "orderId");
      if (!orderId) return;
      const payload = await request("GET", `/api/orders/${orderId}`);
      $("stateOrder").textContent = payload?.data?.status || "-";
    };
    $("adminOrdersBtn").onclick = () => request("GET", "/api/orders/admin?page=1&pageSize=10&status=CREATED", undefined, "admin");
    $("aiBtn").onclick = consultAi;
    $("clearLogBtn").onclick = () => { $("log").textContent = ""; };

    ["productId", "activityId", "orderId"].forEach((id) => $(id).addEventListener("input", updateState));
    updateState();
  </script>
</body>
</html>
