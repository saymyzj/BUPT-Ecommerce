server:
  port: 8082

spring:
  application:
    name: product-seckill-service
  datasource:
    url: jdbc:mysql://localhost:3306/bupt_ecommerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true

app:
  order-service:
    base-url: http://localhost:8083
  local-demo:
    default-user-id: 10001
    default-admin-id: 1
  seckill:
    user-flag-ttl-seconds: 14400
    result-ttl-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info
